services:
  mysql:
    image: mysql:8.0
    container_name: ad_on_wheels_Database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    image: eureka-server
    build:
      context: eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    image: gateway-service
    build:
      context: gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      driver-service:
        condition: service_started
      company-service:
        condition: service_started
      campaign-service:
        condition: service_started
      ride-service:
        condition: service_started

  auth-service:
    image: auth-service
    build:
      context: auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"          # expose auth port for manual requests/testing
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  driver-service:
    image: driver-service
    build:
      context: driver-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"          # expose driver API for debugging
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  company-service:
    image: company-service
    build:
      context: company-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"          # expose company API
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  campaign-service:
    image: campaign-service
    build:
      context: campaign-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"          # expose campaign API
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ride-service:
    image: ride-service
    build:
      context: ride-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"          # expose ride tracking API (matches server.port)
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
