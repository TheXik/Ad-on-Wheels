services:
  mysql:
    image: ad-on-wheels-mysql
    build:
      context: mysql
      dockerfile: Dockerfile
    container_name: ad_on_wheels_Database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    image: eureka-server
    build:
      context: eureka-server
      dockerfile: Dockerfile
    expose:
      - "8761"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  gateway-service:
    image: gateway-service
    build:
      context: gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  auth-service:
    image: auth-service
    build:
      context: auth-service
      dockerfile: Dockerfile
    expose:
      - "8081"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  driver-service:
    image: driver-service
    build:
      context: driver-service
      dockerfile: Dockerfile
    expose:
      - "8082"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  company-service:
    image: company-service
    build:
      context: company-service
      dockerfile: Dockerfile
    expose:
      - "8083"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: ad_on_wheels_minio
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  campaign-service:
    image: campaign-service
    build:
      context: campaign-service
      dockerfile: Dockerfile
    expose:
      - "8084"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  cassandra:
    image: cassandra:4.1
    expose:
      - "9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=adonwheels
      - CASSANDRA_DC=datacenter1
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  ride-service:
    image: ride-service
    build:
      context: ride-service
      dockerfile: Dockerfile
    expose:
      - "8085"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql-data:
  cassandra-data:
  minio-data:
